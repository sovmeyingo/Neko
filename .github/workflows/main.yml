name: Neko releases

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish the current Neko version
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - neko.patch
      - publish-neko.ps1
      - verify-neko-update.cpp
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: neko-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify Neko
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v4
        with:
          path: |
            .deps/*-src
          key: neko-sources-windows-2022-${{ hashFiles('src/cmake/*.cmake') }}

      - name: Build, test and publish Neko
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          if ($env:FORCE_BUILD -eq 'true') {
            ./publish-neko.ps1 -Force
          } else {
            ./publish-neko.ps1
          }
